<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto | FrutiMerca</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div id="transicion-pantalla" class="transicion-pantalla">
        <div class="transicion-contenido">
            <img src="../img/logo.png" alt="FrutiMerca" class="transicion-logo" onerror="this.style.display='none'">
            <div class="transicion-nombre">FrutiMerca</div>
            <div class="transicion-cargando">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>

    <header class="header">
        <div class="header-contenedor">
            <a href="../index.html" class="logo">
                <img src="../img/logo.png" alt="FrutiMerca" onerror="this.style.display='none'">
                <div class="logo-texto">
                    <strong>FrutiMerca</strong>
                    <small>Frutas Frescas</small>
                </div>
            </a>
            <a href="carrito.html" class="btn-carrito">
                🛒 <span id="contador-carrito">0</span>
                <span class="btn-carrito-texto">Tus pedidos</span>
            </a>
            <button class="btn-hamburguesa" id="btn-hamburguesa" onclick="toggleMenu()" aria-label="Abrir menú">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav-principal" id="nav-principal">
                <ul>
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="../index.html#productos">Productos</a></li>
                    <li><a href="conocenos.html">Conócenos</a></li>
                    <li><a href="terminos.html">Términos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="menu-overlay" id="menu-overlay" onclick="cerrarMenu()"></div>

    <main class="producto-wrapper" id="producto-wrapper"></main>

    <footer class="footer">
        <div class="footer-copy">
            <p>© 2026 FrutiMerca — Tu mejor aliado en frutas</p>
        </div>
    </footer>

    <script src="../js/productos.js"></script>
    <script src="../js/carrito.js"></script>

    <script>
        (function() {
            window.addEventListener('load', function() {
                setTimeout(function() {
                    const pantalla = document.getElementById('transicion-pantalla');
                    if (pantalla) {
                        pantalla.classList.add('oculta');
                        setTimeout(function() { pantalla.style.display = 'none'; }, 500);
                    }
                }, 1200);
            });
            document.addEventListener('DOMContentLoaded', function() {
                document.querySelectorAll('a').forEach(function(link) {
                    link.addEventListener('click', function() {
                        const href = link.getAttribute('href');
                        if (!href || href.startsWith('#') || href.startsWith('http') ||
                            href.startsWith('mailto:') || href.startsWith('tel:') ||
                            link.target === '_blank') return;
                        const pantalla = document.getElementById('transicion-pantalla');
                        if (pantalla) {
                            pantalla.classList.remove('oculta');
                            pantalla.style.display = 'flex';
                        }
                    });
                });
            });
            window.addEventListener('pageshow', function(event) {
                if (event.persisted) {
                    const pantalla = document.getElementById('transicion-pantalla');
                    if (pantalla) {
                        pantalla.classList.add('oculta');
                        pantalla.style.display = 'none';
                    }
                }
            });
        })();
    </script>

    <script>
        let PRODUCTO_ACTUAL = null;

        document.addEventListener('DOMContentLoaded', () => {
            verificarResetDiario();

            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            if (!slug) { mostrarNoEncontrado(); return; }

            const productos = obtenerProductos();
            const prod = productos.find(p => p.slug === slug);
            if (!prod) { mostrarNoEncontrado(); return; }

            PRODUCTO_ACTUAL = prod;
            document.title = prod.nombre + ' | FrutiMerca';
            renderizarProducto(prod);

            document.querySelectorAll('.nav-principal a').forEach(link => {
                link.addEventListener('click', () => {
                    if (window.innerWidth <= 900) cerrarMenu();
                });
            });
        });

        function mostrarNoEncontrado() {
            document.getElementById('producto-wrapper').innerHTML = `
                <div class="carrito-vacio">
                    <span class="emoji">🔍</span>
                    <h2>Producto no encontrado</h2>
                    <a href="../index.html" class="btn btn-primario"
                       style="background:var(--azul-marino); color:white; text-decoration:none;">
                        Volver al inicio
                    </a>
                </div>`;
        }

        function renderizarProducto(prod) {
            const wrapper = document.getElementById('producto-wrapper');

            // 1) Stock por presentación
            const presentacionesConStock = prod.presentaciones.map(pres => ({
                ...pres,
                disponible: obtenerStockPresentacion(prod.id, pres.id, true)
            }));

            const algunaDisponible = presentacionesConStock.some(p => p.disponible);
            const productoGlobalmenteDisponible = obtenerStockProducto(prod.id, prod.stock) && algunaDisponible;

            // 2) Primera disponible (para imagen inicial)
            const primeraDisponible = presentacionesConStock.find(p => p.disponible) || presentacionesConStock[0];
            const imagenInicial = resolverRuta(primeraDisponible.imagen || prod.imagen);

            // 3) ¿Está abierta la tienda?
            const abierto = estaAbiertoTienda();

            // 4) Selector de presentaciones
            const opcionesHTML = presentacionesConStock.map((p, i) => {
                const seleccionado = (p === primeraDisponible && p.disponible) ? 'checked' : '';
                const precioTexto = p.precio !== null ? `$${p.precio.toFixed(2)}` : 'Precio a confirmar';
                const sinPrecio = p.precio === null;
                const imagenPres = p.imagen || prod.imagen;
                const disabled = !p.disponible ? 'disabled' : '';

                return `
                    <label class="opcion-presentacion ${seleccionado ? 'seleccionada' : ''} ${!p.disponible ? 'agotada' : ''}">
                        <input type="radio" name="presentacion"
                               value="${p.id}" ${seleccionado} ${disabled}
                               data-precio="${p.precio !== null ? p.precio : ''}"
                               data-imagen="${resolverRuta(imagenPres)}"
                               data-disponible="${p.disponible}"
                               onchange="actualizarOpcionSeleccionada()">
                        <div class="opcion-info">
                            <strong>${p.nombre}</strong>
                            <span class="opcion-precio ${sinPrecio ? 'pendiente' : ''}">
                                ${precioTexto}
                                ${!p.disponible ? ' · <em style="color:#a02020;">Agotado</em>' : ''}
                            </span>
                        </div>
                    </label>`;
            }).join('');

            // 5) Estado del botón
            let botonHTML = '';
            if (!productoGlobalmenteDisponible) {
                botonHTML = `<button class="btn-comprar btn-grande" disabled
                                     style="background:#94a3b8;color:white;">
                                ❌ Producto agotado
                             </button>`;
            } else if (!abierto) {
                botonHTML = `<button class="btn-comprar btn-grande" disabled
                                     style="background:#94a3b8;color:white;">
                                🌙 Pedidos cerrados (abre 10:00 PM)
                             </button>`;
            } else {
                botonHTML = `<button class="btn-comprar btn-agregar btn-grande"
                                     onclick="agregarDesdeDetalle(${prod.id})">
                                🛒 Agregar al carrito
                             </button>`;
            }

            // 6) Aviso de horario cerrado
            const avisoHorario = !abierto ? `
                <div class="aviso-horario-cerrado">
                    🌙 <strong>Pedidos cerrados por hoy.</strong>
                    El sistema de pedidos en línea abre hoy a las <strong>10:00 PM</strong>.
                </div>` : '';

            // 7) Marca de agua si agotado
            const marcaAgua = !productoGlobalmenteDisponible ? `
                <div class="marca-agua-agotado"><span>AGOTADO</span></div>` : '';

            wrapper.innerHTML = `
                <a href="../index.html#productos" class="volver-link">
                    ← Volver a productos
                </a>

                ${avisoHorario}

                <div class="producto-detalle">
                    <div class="producto-imagen ${!productoGlobalmenteDisponible ? 'agotado' : ''}">
                        ${marcaAgua}
                        <img id="imagen-producto"
                             src="${imagenInicial}"
                             alt="${prod.nombre}"
                             onerror="this.src='https://via.placeholder.com/800x600/0f2b5b/ffffff?text=FrutiMerca'">
                        <span class="producto-badge">
                            ${prod.categoria.indexOf('frutilla') !== -1 ? '🍓 Frutilla' : '🍇 Fruta'}
                        </span>
                    </div>

                    <div class="producto-info">
                        <h1>${prod.nombre}</h1>
                        <p class="producto-descripcion">${prod.descripcion}</p>

                        <div class="producto-separador"></div>

                        <h3 class="selector-titulo">Elige tu presentación:</h3>
                        <div class="opciones-presentacion">
                            ${opcionesHTML}
                        </div>

                        <div class="producto-acciones">
                            ${botonHTML}
                        </div>

                        <div class="producto-notas">
                            <p>📦 ${prod.empaque || 'Consulta el empaque de entrega'}</p>
                            <p>🚚 Envío: Central $3 · Durán $1</p>
                            <p>🏪 Retiro gratis en Mercado José Mascote #214</p>
                            <p>💳 Pago por transferencia Banco Pichincha</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function actualizarOpcionSeleccionada() {
            document.querySelectorAll('.opcion-presentacion').forEach(el => {
                const radio = el.querySelector('input');
                el.classList.toggle('seleccionada', radio.checked);
            });

            const radio = document.querySelector('input[name="presentacion"]:checked');
            if (!radio) return;

            const nuevaImagen = radio.dataset.imagen;
            const imagenEl = document.getElementById('imagen-producto');
            if (imagenEl && nuevaImagen && imagenEl.src !== nuevaImagen) {
                imagenEl.src = nuevaImagen;
            }
        }

        function agregarDesdeDetalle(idProducto) {
            if (!estaAbiertoTienda()) {
                alert('🌙 Los pedidos en línea están cerrados.\nAbrimos hoy a las 10:00 PM.');
                return;
            }

            const radio = document.querySelector('input[name="presentacion"]:checked');
            if (!radio) {
                alert('Selecciona una presentación');
                return;
            }

            if (radio.dataset.disponible === 'false' || radio.disabled) {
                alert('Esta presentación está agotada.');
                return;
            }

            const precio = radio.dataset.precio;
            if (!precio) {
                alert('Este producto tiene precio a confirmar. Contáctanos por teléfono.');
                return;
            }

            const presentacionId = radio.value;
            const productos = obtenerProductos();
            const prod = productos.find(p => p.id === idProducto);
            const pres = prod.presentaciones.find(p => p.id === presentacionId);

            agregarAlCarritoConPresentacion(prod, pres);
        }

        function agregarAlCarritoConPresentacion(prod, pres) {
            const carrito = obtenerCarrito();
            const clave = prod.id + '-' + pres.id;
            const existente = carrito.find(item => item.clave === clave);

            if (existente) {
                existente.cantidad += 1;
            } else {
                carrito.push({
                    clave: clave,
                    id: prod.id,
                    nombre: prod.nombre + ' — ' + pres.nombre,
                    precio: pres.precio,
                    unidad: pres.nombre,
                    imagen: resolverRuta(pres.imagen || prod.imagen),
                    cantidad: 1
                });
            }

            guardarCarrito(carrito);
            mostrarToast(`✅ ${prod.nombre} (${pres.nombre}) agregado`);
        }

        function toggleMenu() {
            const nav = document.getElementById('nav-principal');
            const btn = document.getElementById('btn-hamburguesa');
            const overlay = document.getElementById('menu-overlay');
            nav.classList.toggle('abierto');
            btn.classList.toggle('activo');
            overlay.classList.toggle('activo');
            document.body.style.overflow = nav.classList.contains('abierto') ? 'hidden' : '';
        }

        function cerrarMenu() {
            const nav = document.getElementById('nav-principal');
            const btn = document.getElementById('btn-hamburguesa');
            const overlay = document.getElementById('menu-overlay');
            nav.classList.remove('abierto');
            btn.classList.remove('activo');
            overlay.classList.remove('activo');
            document.body.style.overflow = '';
        }

        window.addEventListener('resize', () => {
            if (window.innerWidth > 900) cerrarMenu();
        });
    </script>
</body>
</html>
